[t3.instructions]
value = """## T3 Code

仅当会话上下文明确运行于 T3 Code 时，本节才适用；各项能力以当前可用工具为准。非 T3 环境忽略本节。

### 浏览器验证

- 浏览器验证优先使用 T3 内置的 `preview_*` 工具。
- 仅在 T3 Preview 工具不可用或无法满足任务需求时，才考虑 OpenCLI 或 Computer Use；切换前简述具体限制。
- `profileId: "default"` 是 T3 的默认 profile，不代表共享本机 Chrome 登录态。需要隔离默认登录态时，用 `profileId: "incognito"` 和 `reuseExistingTab: false` 新建标签页；已有标签页保持原 profile。

### 任务委派

委派子任务按**「先定模型，再选工具」**决策：

1. **先定模型**：
   - 前端开发（含页面实现、UI/原型还原、样式与交互修复）：确认目标仓库和适用规则后，**默认委派给 `deepseek-flash`**。由子 agent 定位代码、实现和验证，主 agent 负责接口协调与验收，不直接代写前端。
   - explore（搜索、定位代码、梳理调用关系）与简单任务（目标明确、范围小、验收清晰）：按需委派；委派时默认用 `deepseek-flash`。
   - 其他子任务：默认沿用当前模型。
2. **再选工具与角色**：
   - 目标模型与当前线程一致时，用当前 harness 原生子 agent 工具（如 OpenCode `subagent`、Claude Code `Agent`、Codex `spawn_agent`）。
   - 目标模型与当前线程不同时（例如 Codex/Sol 派 `deepseek-flash`），**必须用 T3 `delegate_task`**（首次前用 `orchestrator_capabilities` 确认可用模型，如 `target.model = "deepseek/deepseek-flash"`）。
   - 命中命名角色（如 `UI Designer`）但需跨模型时，仍走 `delegate_task` 指定目标模型，并在委派提示中要求子 agent 先读取对应角色定义文件（如 `~/.codex/agents/design-ui-designer.toml` 或 `~/.config/opencode/agents/design-ui-designer.md`）；不得为使用原生角色而放弃默认模型。
3. **返工与通信**：
   - 同一任务的后续修改或返工：原生子 agent 优先续接原实例；`delegate_task` 按需携带变更上下文新开委派。
   - 线程间传消息优先走接收方能直接收到的通道（同 harness 走原生；跨 harness 或无原生能力时用 `t3_thread_send`，`mode` 优先 `steer`）。父 agent 需关注回传，必要时用 `t3_thread_read` 读取结果。

### 跨线程回复

- 收到其他线程 agent 发来的消息并需要答复时，通过 `t3_thread_send` 将答复发回发送方线程；即使消息以 `user` 角色注入，也按实际发送方回复，不能仅在当前对话中回答用户。
- 以消息元数据中的 `senderThreadId` 确认接收线程；当前上下文未显示时，用 `t3_thread_read` 读取当前线程对应消息，核对发送方，跨环境时同时使用对应的 `environmentId`。"""
