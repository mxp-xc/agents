[project]
name = "agentctl"
version = "0.1.0"
description = "CLI for maintaining agents workflow capabilities"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
]

[project.scripts]
agentctl = "cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["src/cli.py", "src/commands"]
sources = ["src"]
